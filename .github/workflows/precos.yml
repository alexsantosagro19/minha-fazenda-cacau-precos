name: Preços do cacau

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 10h de Brasília, segunda a sexta
    - cron: '0 19 * * 1-5'   # 16h de Brasília, segunda a sexta
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: precos
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testar o leitor de preços
        run: node teste/testar.mjs
      - name: Coletar preços
        run: node coletar.mjs
      - name: Gravar o arquivo de preços
        run: |
          git config user.name "robo-precos"
          git config user.email "robo-precos@users.noreply.github.com"
          git add dados/precos.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Preços $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
